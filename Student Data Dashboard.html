<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student Data Dashboard</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<!-- <script src="js/chart.min.js"></script> -->
</head>
<body>
<header>
  <h1>Student Data Dashboard</h1>
  <select id="dept" aria-label="Department filter"></select>
</header>
<main>
  <section class="kpis" id="kpis"></section>
  <section class="charts">
    <div class="card"><h2>Enrollment by grade</h2><div class="chart-box"><canvas id="c1"></canvas></div></div>
    <div class="card"><h2>Attendance rate (monthly)</h2><div class="chart-box"><canvas id="c2"></canvas></div></div>
    <div class="card"><h2>Students by status</h2><div class="chart-box"><canvas id="c3"></canvas></div></div>
  </section>
  <section class="card">
    <h2>Students</h2>
    <div class="table-wrap"><table><thead><tr><th>Name</th><th>Grade</th><th>Department</th><th>GPA</th><th>Attendance</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div>
  </section>
</main>
<button onClick="triggerUploadDataPage()" type="button" id="uploadCSV"> Upload CSV</button>
<script src="js/dashboard.js">
  document.getElementById('uploadCSV').addEventListener('click', triggerUploadDataPage);
</script>
</body>
</html>
