<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Upload Data</title>

<body>

<p> Instructions: Specify the exact name of the entire dataset (Retrievers Essentials Department Student Impact Data) in the "Name" field. 
    Download your data in whatever tool (Excel, Google Spreadsheets, etc) as a CSV file. Upload the file into the "File" button.</p>



<div class="upload-form">
    <input type="text" id="datasetName" placeholder="Dataset name (e.g., Retrievers Essentials Department Student Impact Data)" />
    <input type="file" id="dataUpload" accept=".csv" />
    <button onclick="handleUpload()">Upload Data</button>
</div>

</body>
</html>
