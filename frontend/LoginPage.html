<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login Page</title>

<body>

<p> Regardless of whether you are an administrator or staff member, please login to view the dashboard. 
    Your accesses will automatically enforce what functions you can do and what things you can do.</p>

    <button onclick="login()">Login</button>
</div>

<button onClick="returnToDashboard()" type="button" id="returnDashboard"> Return to Dashboard</button>
<script src="js/uploadData.js"></script>

</body>
</html>
