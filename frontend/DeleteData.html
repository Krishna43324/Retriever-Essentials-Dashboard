<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Delete Data</title>
<link rel="stylesheet" href="/frontend/style.css">
</head>
<body class="form-page">

<div class="form-shell">
    <div class="form-brand">
        <img class="brand-logo" src="/frontend/images/umbc-logo.png" alt="University of Maryland, Baltimore County" onerror="this.hidden=true;this.nextElementSibling.hidden=false">
        <span class="brand-fallback" hidden>UMBC</span>
        <span><strong>Retriever Essentials</strong><small>Dataset management</small></span>
    </div>

    <div class="form-card">
        <h1>Delete data</h1>
        <p class="form-lead">Permanently remove a dataset you previously uploaded.</p>

        <div class="form-note">
            <span aria-hidden="true">ⓘ</span>
            <div>Enter the exact dataset name you used when uploading. The system will check your permissions;
            if you have access, the dataset will be removed.</div>
        </div>

        <div class="dataset">
            <div class="field">
                <label for="datasetName">Dataset name</label>
                <input type="text" id="datasetName" placeholder="e.g., Retrievers Essentials Department Student Impact Data" />
            </div>
        </div>

        <div class="form-actions">
            <button class="btn btn-danger" onclick="deleteData()">Delete Data</button>
            <button class="btn btn-ghost" onClick="returnToDashboard()" type="button" id="returnDashboard">← Return to Dashboard</button>
        </div>
    </div>
</div>

<script src="js/deleteData.js"></script>
</body>
</html>
